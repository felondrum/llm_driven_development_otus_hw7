[project]
name = "llm-multilingual-assistant"
version = "0.1.0"
description = "Многоязычный диалоговый ассистент с LoRA и LangChain Tools (Ollama backend)"
requires-python = ">=3.11"
dependencies = [
    # API dependencies
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    # Training dependencies (LoRA/PEFT)
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "peft>=0.10.0",
    "accelerate>=0.28.0",
    "torch>=2.2.0",
    "bitsandbytes>=0.42.0",
    "trl>=0.8.0",
    "langchain_classic"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]