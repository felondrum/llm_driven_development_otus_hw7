version: '3.8'

services:
  ollama-server:
    image: ollama/ollama:latest
    container_name: ollama-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: apple_gpu # Для Mac M1/M2/M3
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  llm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-assistant-app
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://ollama-server:11434
      - MODEL_NAME=qwen2.5:3b
    depends_on:
      ollama-server:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    restart: unless-stopped

volumes:
  ollama_data: