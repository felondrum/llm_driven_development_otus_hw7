# Docker Compose for Multilingual Assistant
# Optimized for Mac M1 (ARM64)

services:
  # Qwen2 Inference Server
  qwen-inference:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwen-inference
    platform: linux/arm64
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - huggingface_cache:/root/.cache/huggingface
    environment:
      - MODEL_NAME=Qwen/Qwen2-1.5B-Instruct
      - MAX_LENGTH=512
      - DEVICE=cpu
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Optional: Redis for caching
  redis:
    image: redis:7-alpine
    container_name: assistant-redis
    platform: linux/arm64
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  huggingface_cache:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    driver: bridge
